<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tính tổng số chia hết cho 3</title>
</head>
<body>

    <h2>Tính tổng các số chia hết cho 3</h2>
    <form onsubmit="handleSubmit(event)">
        <div>
            <label for="startNum">Số đầu:</label>
            <input type="number" id="startNum" required>
        </div>
        <br>
        <div>
            <label for="endNum">Số cuối:</label>
            <input type="number" id="endNum" required>
        </div>
        <br>
        <button type="submit">Tính tổng</button>
    </form>

    <h3 id="result"></h3>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            
            // Lấy giá trị số đầu và số cuối từ input và chuyển sang kiểu số nguyên
            const start = parseInt(document.getElementById("startNum").value);
            const end = parseInt(document.getElementById("endNum").value);
            
            let sum = 0;
            let min = Math.min(start, end);
            let max = Math.max(start, end);
            
            // Vòng lặp duyệt qua khoảng từ số nhỏ đến số lớn
            for (let i = min; i <= max; i++) {
                if (i % 3 === 0) {
                    sum += i;
                }
            }
            
            // In kết quả ra giao diện và console
            const resultText = `Tổng các số chia hết cho 3 từ ${min} đến ${max} là: ${sum}`;
            document.getElementById("result").innerText = resultText;
            console.log(resultText);
        }
    </script>

</body>
</html>
